name: Market Analytics Pipeline (IST)

on:
  schedule:
    # Daily run at 8:00 PM IST (14:30 UTC)
    - cron: "30 14 * * *"

    # Monthly refresh (same time)
    - cron: "30 14 1 * *"

  workflow_dispatch:

jobs:
  run-market-analytics:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout source repo (EOD2)
      # -----------------------------
      - name: Checkout EOD2 repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------
      # Python setup
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # -----------------------------
      # Update NSE EOD data
      # -----------------------------
      - name: Update NSE EOD data
        run: |
          python -u src/init.py || echo "[INFO] NSE EOD not available yet, continuing"

      # -----------------------------
      # Run analytics (creates breadth_base.csv)
      # -----------------------------
      - name: Run market analytics
        run: |
          python -u src/analytics.py

      # -----------------------------
      # Checkout MarketAnalytics repo
      # -----------------------------
      - name: Checkout MarketAnalytics repo
        uses: actions/checkout@v4
        with:
          repository: achyuthunipradyumna-sudo/MarketAnalytics
          path: MarketAnalytics
          token: ${{ secrets.MARKET_ANALYTICS_PAT }}

      # -----------------------------
      # Explicitly remove deprecated generated files
      # -----------------------------
      - name: Remove deprecated generated files
        run: |
          set -e
          cd MarketAnalytics

          # These were generated by older workflows
          rm -f dashboard.html
          rm -f trend.html
          rm -f volatility.html

      # -----------------------------
      # Copy ONLY the canonical CSV
      # -----------------------------
      - name: Copy analytics output
        run: |
          set -e
          mkdir -p MarketAnalytics/data/history

          if [ ! -f src/output/breadth_base.csv ]; then
            echo "[ERROR] breadth_base.csv not found"
            exit 1
          fi

          cp src/output/breadth_base.csv \
             MarketAnalytics/data/history/breadth_base.csv

      # -----------------------------
      # Commit & push (stages deletions + updates)
      # -----------------------------
      - name: Commit & push MarketAnalytics updates
        env:
          PAT: ${{ secrets.MARKET_ANALYTICS_PAT }}
        run: |
          cd MarketAnalytics

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote set-url origin \
            https://x-access-token:${PAT}@github.com/achyuthunipradyumna-sudo/MarketAnalytics.git

          echo "----- Git status before commit -----"
          git status

          if [[ -n "$(git status --porcelain)" ]]; then
            # CRITICAL: stages file deletions + updates
            git add -A
            git commit -m "Automated breadth base update (explicit cleanup of deprecated files)"
            git push origin main
          else
            echo "[INFO] No changes to commit"
          fi
